  <body class="bg-[#070b14] text-[#f3f7ff] antialiased min-h-screen select-none overflow-x-hidden font-sans">
    <div id="root"></div>
  
    <script>
      // Diagnostic et guide visuel si ouvert par double-clic (protocole file://)
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && (!root.children || root.children.length === 0)) {
              root.innerHTML = '<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; color: #f3f7ff; background: #070b14;">' +
                '<div style="max-width: 640px; width: 100%; background: #0f172a; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);">' +
                  '<div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">' +
                    '<div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); display: flex; align-items: center; justify-content: center; font-size: 24px;">🎮</div>' +
                    '<div>' +
                      '<h1 style="margin: 0; font-size: 20px; font-weight: 800; color: #fff;">evoX Start Page Browser</h1>' +
                      '<p style="margin: 3px 0 0; font-size: 13px; color: #94a3b8;">Ouverture locale directe détectée (protocole file://)</p>' +
                    '</div>' +
                  '</div>' +
                  '<div style="background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.25); border-radius: 10px; padding: 14px; margin-bottom: 22px; color: #fcd34d; font-size: 13px; line-height: 1.5;">' +
                    '<strong>ℹ️ Pourquoi l\'écran était noir ?</strong><br/>' +
                    'Les navigateurs modernes (Chrome, Edge, Firefox) bloquent par sécurité les scripts JavaScript modulaires lorsqu\'on double-clique directement sur un fichier HTML en local (politique de sécurité CORS du protocole <code>file://</code>). C\'est 100% normal !' +
                  '</div>' +
                  '<h2 style="font-size: 15px; font-weight: 700; color: #38bdf8; margin: 0 0 12px;">Comment lancer la page :</h2>' +
                  '<div style="display: flex; flex-direction: column; gap: 12px;">' +
                    '<div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px;">' +
                      '<div style="font-weight: 700; color: #fff; font-size: 14px; margin-bottom: 4px;">🚀 Option 1 : Déposer sur GitHub Pages (Recommandé pour la PS5)</div>' +
                      '<p style="margin: 0 0 6px; font-size: 13px; color: #cbd5e1; line-height: 1.5;">Déposez tous les fichiers de l\'archive à la racine de votre dépôt GitHub et activez <strong>GitHub Pages</strong>. La page fonctionnera immédiatement en HTTPS sur votre PC et sur le navigateur PS5 !</p>' +
                    '</div>' +
                    '<div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 16px;">' +
                      '<div style="font-weight: 700; color: #fff; font-size: 14px; margin-bottom: 4px;">💻 Option 2 : Tester sur votre PC</div>' +
                      '<p style="margin: 0 0 6px; font-size: 13px; color: #cbd5e1; line-height: 1.5;">Double-cliquez sur le fichier <code>start-server.bat</code> inclus dans l\'archive (ou utilisez <em>Live Server</em> dans VS Code, ou <code>npx serve</code>).</p>' +
                    '</div>' +
                  '</div>' +
                '</div>' +
              '</div>';
            }
          }, 400);
        });
      }
    </script>
  
  </body>
