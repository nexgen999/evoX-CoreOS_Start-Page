      var clean = url.split('?')[0].replace(/^\.\//, '');

Page de démarrage ultra-rapide et personnalisable, optimisée pour le navigateur de la PlayStation 5 (et manette DualSense).

## 📁 Contenu de l'archive
- \`index.html\` : Point d'entrée de l'application React complète.
- \`config.json\` : L'unique fichier de configuration pour vos raccourcis, profil et badges.
- \`assets/\` : Scripts, styles et images de marque (evox.svg, playstation-light.png).
- \`translations/\` : Les 30 langues disponibles.
- \`start-server.bat\` : Lanceur 1-clic pour tester sur PC sous Windows sans rien configurer.

## ❓ Pourquoi une page noire en double-cliquant sur index.html ?
Les navigateurs web actuels (Google Chrome, Microsoft Edge, Mozilla Firefox) intègrent une règle de sécurité stricte (politique CORS) : ils interdisent le chargement de scripts modulaires JavaScript modernes lorsque l'on double-clique directement sur un fichier local (\`file://\`). C'est un comportement **100% normal** commun à tous les projets web modernes.

## 🚀 Mise en ligne sur GitHub Pages (Recommandé pour PS5)
1. Créez ou ouvrez votre dépôt GitHub (ex: \`evoX-CoreOS_Start-Page\`).
2. Déposez tous les fichiers de ce dossier ZIP à la racine du dépôt (\`index.html\`, \`config.json\`, \`assets/\`, \`translations/\`).
3. Allez dans **Settings** > **Pages** de votre dépôt GitHub.
4. Dans **Build and deployment**, choisissez **Source: Deploy from a branch**, branche **main** (ou \`master\`), dossier **/ (root)**.
5. Cliquez sur **Save**.
6. Votre page sera active et fonctionnera à 100% sur PC et sur votre PS5 à l'adresse : \`https://<votre-pseudo>.github.io/<nom-du-repo>/\` !

## 💻 Comment tester sur PC en local ?
- **Méthode 1 (la plus simple sous Windows)** : double-cliquez sur \`start-server.bat\`.
- **Méthode 2 (VS Code)** : Clic droit sur \`index.html\` > *Open with Live Server*.
- **Méthode 3 (Terminal)** : Tapez \`npx serve\` ou \`python -m http.server 8000\` puis visitez \`http://localhost:8000\`.

## 🎨 Personnaliser vos icônes dans config.json et assets/
Pour ajouter ou modifier vos propres icônes de raccourcis :
1. Placez vos images (PNG, SVG, JPG, WEBP, ICO) dans le dossier \`assets/\` (ex: \`assets/mon-icone.png\`).
2. Dans \`config.json\`, indiquez le chemin dans la propriété \`"icon"\` : \`"assets/mon-icone.png"\`.
3. C'est tout ! L'application détecte automatiquement le chemin de l'image et l'affiche immédiatement sur votre PC et votre PS5 sans configuration complexe.

## 🎮 Fonctionnalités incluses
- **Compatibilité 100% PS5 & DualSense** : drapeaux SVG haute fidélité (sans dépendre des polices émojis de la console) et boutons de fermeture SVG natifs.
- **What's New latéral** : volet complet avec onglets Readme (images visibles), Notes de version (Releases) et liste des Assets.
