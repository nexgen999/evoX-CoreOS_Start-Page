<!doctype html>
<html lang="fr" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070b14">
<title>evoX Start Page Browser</title>
<meta name="description" content="Page de démarrage evoX optimisée pour le navigateur PS5.">
<link rel="icon" type="image/png" href="./assets/playstation-light.png">
<style>
:root{color-scheme:dark;--bg:#070b14;--panel:#101827;--panel2:#152238;--text:#f3f7ff;--muted:#94a3b8;--blue:#168cff;--border:rgba(255,255,255,.12)}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(22,140,255,.12),transparent 46%),var(--bg);color:var(--text);font:16px/1.45 Arial,Helvetica,sans-serif}
button,input{font:inherit}
button,a,input{-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
.shell{width:min(1100px,100%);margin:auto;padding:clamp(18px,4vh,44px) clamp(14px,3vw,36px) 24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:clamp(24px,5vh,46px)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:42px;height:42px;object-fit:contain}
.brand h1{font-size:clamp(24px,3.2vw,34px);line-height:1.1;letter-spacing:-1.2px;margin:0;font-weight:800}
.brand .x{color:#38bdf8}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.04em;margin-top:4px}
.actions{display:flex;gap:8px;align-items:center}
.lang{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:42px}
.profile{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--text);border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:5px 12px 5px 5px}
.profile img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.profile span{font-size:13px;font-weight:700}
.search{display:flex;gap:8px;padding:8px;background:var(--panel);border:1px solid var(--border);border-radius:15px;margin:0 auto clamp(28px,5vh,42px);box-shadow:0 12px 32px rgba(0,0,0,.18)}
.search input{flex:1;min-width:0;height:48px;border:0;outline:0;background:transparent;color:var(--text);padding:0 12px;font-size:clamp(16px,2vw,19px)}
.search input::placeholder{color:#8492a7}
.primary{border:0;border-radius:10px;background:var(--blue);color:white;padding:0 22px;min-height:48px;font-weight:700}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px}
.section-head h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{display:flex;align-items:center;gap:13px;min-width:0;min-height:88px;padding:14px;background:linear-gradient(135deg,var(--panel),#0c1422);border:2px solid var(--border);border-radius:13px;color:var(--text);text-decoration:none;outline:0;transition:border-color .12s,background .12s}
.tile:focus,.tile:focus-visible,.tile:hover{border-color:var(--blue);background:var(--panel2)}
.tile img{width:46px;height:46px;object-fit:contain;flex:0 0 46px;border-radius:9px}
.tile .fallback{width:46px;height:46px;flex:0 0 46px;border-radius:9px;display:grid;place-items:center;background:#172b46;color:#38bdf8;font-weight:800;font-size:20px}
.tile .label{min-width:0;overflow-wrap:anywhere;font-size:14px;font-weight:700}
.empty{padding:24px;text-align:center;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}
footer{margin-top:32px;text-align:center;color:#718096;font-size:12px}
footer a{color:#93c5fd;text-decoration:none}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{padding:11px;gap:9px;min-height:78px}.tile img,.tile .fallback{width:38px;height:38px;flex-basis:38px}.profile span{display:none}}
@media(max-width:420px){.grid{grid-template-columns:1fr}.brand img{width:34px;height:34px}.top{align-items:flex-start}.search{padding:6px}.primary{padding:0 15px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand">
      <img id="brandIcon" src="./assets/playstation-light.png" alt="" width="42" height="42">
      <div><h1><span style="color:#f3f7ff">evo</span><span class="x">X</span> <span id="brandSuffix">Start</span></h1><small id="subtitle">START PAGE BROWSER</small></div>
    </div>
    <div class="actions">
      <select id="language" class="lang" aria-label="Language">
        <option value="fr">FR</option><option value="en">EN</option>
      </select>
      <a class="profile" id="profileLink" href="https://github.com/nexgen999" rel="noopener">
        <img id="avatar" src="https://github.com/nexgen999.png" alt="" width="30" height="30" loading="lazy">
        <span id="profileName">nexgen999</span>
      </a>
    </div>
  </header>

  <form class="search" id="searchForm" role="search">
    <input id="searchInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url" placeholder="Rechercher ou saisir une adresse…" aria-label="Recherche ou adresse web">
    <button class="primary" id="goButton" type="submit">Aller</button>
  </form>

  <section>
    <div class="section-head"><h2 id="shortcutsTitle">Accès rapides</h2></div>
    <div class="grid" id="shortcutGrid"></div>
    <div class="empty" id="emptyState" hidden>Aucun raccourci disponible.</div>
  </section>

  <footer>
    <div id="footerText">evoX Start Page Browser</div>
    <div id="footerSub">Conçue pour une navigation simple et fluide sur PS5.</div>
    <div id="footerBadges" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px"></div>
  </footer>
</main>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const TXT={
  fr:{subtitle:'PAGE DE DÉMARRAGE',search:'Rechercher sur Google ou saisir une URL…',go:'Aller',shortcuts:'Accès rapides',empty:'Aucun raccourci disponible.',footer:'Conçue pour une navigation simple et fluide sur PS5.'},
  en:{subtitle:'START PAGE BROWSER',search:'Search Google or enter a URL…',go:'Go',shortcuts:'Quick access',empty:'No shortcuts available.',footer:'Designed for simple, smooth navigation on PS5.'}
};
let config={};
let shortcuts=[];
let language='fr';
function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:null}catch{return null}}
function normaliseInput(raw){
  const v=raw.trim(); if(!v)return null;
  if(/^[a-z][a-z0-9+.-]*:/i.test(v))return v;
  if(!/\s/.test(v)&&(/^(localhost|127(?:\.\d{1,3}){3})(:\d+)?(\/.*)?$|^(?:[\w-]+\.)+[a-z]{2,}(?::\d+)?(\/.*)?$/i.test(v)))return 'https://'+v;
  return (config.searchEngine||'https://www.google.com/search?q={query}').replace('{query}',encodeURIComponent(v));
}
function applyLanguage(lang){
  language=TXT[lang]?lang:'fr'; const t=TXT[language];
  document.documentElement.lang=language;
  $('language').value=language;
  $('subtitle').textContent=t.subtitle;
  $('searchInput').placeholder=t.search;
  $('goButton').textContent=t.go;
  $('shortcutsTitle').textContent=t.shortcuts;
  $('emptyState').textContent=t.empty;
  $('footerSub').textContent=(config.footer&&config.footer.subtext)||t.footer;
  try{localStorage.setItem('evox-start-language',language)}catch{}
}
function iconFallback(title){
  const el=document.createElement('div');el.className='fallback';el.textContent=(title||'?').trim().charAt(0).toUpperCase()||'?';return el;
}
function render(){
  const grid=$('shortcutGrid');grid.textContent='';
  const all=shortcuts;
  $('emptyState').hidden=all.length>0;
  all.forEach((s)=>{
    const url=safeUrl(s.url);if(!url)return;
    const a=document.createElement('a');a.className='tile';a.href=url;a.setAttribute('aria-label',s.name||url);
    a.rel='noopener';a.tabIndex=0;
    const icon=s.icon||'';
    if(icon){
      const img=document.createElement('img');img.src=icon;img.alt='';img.loading='lazy';img.decoding='async';
      img.onerror=()=>{img.replaceWith(iconFallback(s.name))};a.appendChild(img);
    }else a.appendChild(iconFallback(s.name));
    const label=document.createElement('span');label.className='label';label.textContent=s.name||url;a.appendChild(label);
    grid.appendChild(a);
  });
}
$('searchForm').addEventListener('submit',e=>{e.preventDefault();const d=normaliseInput($('searchInput').value);if(d)location.href=d});
$('language').addEventListener('change',e=>applyLanguage(e.target.value));

function renderBadges(){
  const holder=$('footerBadges');holder.textContent='';
  (config.footer&&Array.isArray(config.footer.badges)?config.footer.badges:[]).forEach(b=>{
    if(!b.url||!safeUrl(b.url))return;
    const a=document.createElement('a');a.href=b.url;a.rel='noopener';
    
    // Restauration exacte du format d'origine récupéré depuis config.json
    a.textContent = [b.label, b.subLabel].filter(Boolean).join(' ');
    
    a.style.cssText='display:inline-block;padding:7px 10px;border-radius:8px;text-decoration:none;font-size:11px;font-weight:700;border:1px solid '+(b.accentColor||'#334155')+';background:'+(b.bgColor||'#111827')+';color:'+(b.textColor||'#e5e7eb');
    holder.appendChild(a);
  });
}

function setConfig(c){
  config=c||{};
  if(config.title)document.title=config.title;
  if(config.brand&&config.brand.icon){
    const img=$('brandIcon');img.src=config.brand.localAssetFallback||config.brand.icon;
    img.onerror=()=>{if(img.src!==config.brand.icon)img.src=config.brand.icon;else img.style.display='none'};
  }
  if(config.profile){$('profileName').textContent=config.profile.name||'nexgen999';$('profileLink').href=safeUrl(config.profile.github)||'https://github.com/nexgen999';if(config.profile.avatar)$('avatar').src=config.profile.avatar}
  shortcuts=Array.isArray(config.shortcuts)?config.shortcuts.filter(s=>s&&safeUrl(s.url)).map(s=>({name:s.name||s.url,url:s.url,icon:s.icon||''})):[];
  $('footerText').textContent=(config.footer&&config.footer.text)||'evoX Start Page Browser';
  renderBadges();
  const preferred=(()=>{try{return localStorage.getItem('evox-start-language')}catch{return null}})();
  applyLanguage(preferred||config.language||'fr');
  render();
}
fetch('./config.json',{cache:'force-cache'}).then(r=>{if(!r.ok)throw Error('config');return r.json()}).then(setConfig).catch(()=>{setConfig({language:'fr',shortcuts:[],searchEngine:'https://www.google.com/search?q={query}'})});
})();
</script>
</body>
</html>
